# Set to JAVA JDK Path directory
#org.gradle.java.home={JDK PATH}

projectGroup=com.reyga-dev.starter
projectVersion=1.1.0

# Nexus publishing configuration. Use a -SNAPSHOT projectVersion to publish to
# nexusSnapshotRepositoryUrl; all other versions use nexusReleaseRepositoryUrl.
nexusReleaseRepositoryUrl=http://localhost:8081/repository/maven-releases/
nexusSnapshotRepositoryUrl=http://localhost:8081/repository/maven-snapshots/
nexusUsername=your-nexus-username
nexusPassword=your-nexus-password
nexusAllowInsecureProtocol=true

javaVersion=25

springDependencyManagementPluginVersion=1.1.5
springBootPluginVersion=4.0.0
springBootVersion=4.0.0
springFrameworkVersion=7.0.1

junitJupiterVersion=5.12.2
mockitoVersion=5.14.2
byteBuddyVersion=1.17.7
jakartaPersistenceApiVersion=3.1.0
lombokVersion=1.18.38
jacksonDatabindVersion=2.21.2
mapstructVersion=1.6.3
lombokMapstructBindingVersion=0.2.0
ojdbcVersion=23.7.0.25.01
springDataCommonsVersion=4.0.0
jakartaValidationApiVersion=3.1.1
resilience4jVersion=2.3.0
logbackClassicVersion=1.5.38
